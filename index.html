<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTel Arrow Benchmark Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Experimental immutable run store</div>
      <h1>OTel Arrow Benchmarks</h1>
      <p id="summary">Loading benchmark data...</p>
    </div>
    <nav>
      <button class="active" data-view="comparison">Latest comparison</button>
      <button data-view="history">History</button>
    </nav>
  </header>
  <main>
    <section id="comparison-view"></section>
    <section id="history-view" hidden></section>
  </main>
  <footer>
    Generated entirely from immutable run bundles. Derived indexes are replaceable.
  </footer>
  <script src="app.js"></script>
</body>
</html>
